<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<title>Business — Aliko</title>
<!-- Resource hints: open connections to the map/tile hosts before they're
     actually needed, so the first tile/script request doesn't also pay
     for DNS + TLS negotiation — real, measurable time off first paint. -->
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">
<link rel="dns-prefetch" href="https://tiles.openfreemap.org">
<link rel="preload" as="script" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/shared.css"><link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app">
  <div id="site-header"></div>
  <main class="shell" id="profileMain"><div class="loading">Loading business…</div></main>
</div>

<!-- Full-screen navigation overlay, hidden until "Start navigation" -->
<div id="navPanel" class="hidden">
  <div id="navMap"></div>

  <div class="nav-acquiring" id="navAcquiring">
    <div class="nav-radar"><span></span><span></span><span></span></div>
    <div class="nav-acquiring-text">Locating you…</div>
  </div>

  <div class="nav-topbar">
    <button class="nav-exit" id="navExitBtn">←</button>
    <div class="nav-instruction">
      <div class="nav-instruction-icon" id="navIcon">↑</div>
      <div class="nav-instruction-text">
        <div class="nav-instruction-dist" id="navDist">—</div>
        <div class="nav-instruction-main" id="navMain">Preparing route…</div>
        <div class="nav-instruction-road" id="navRoad"></div>
      </div>
    </div>
  </div>

  <div class="nav-chips">
    <div class="nav-chip hidden" id="navWeatherChip"></div>
    <div class="nav-chip hidden" id="navBatteryChip">🔋 Battery saver</div>
  </div>

  <div class="nav-alt-chip hidden" id="navAltChip">
    <span id="navAltDelta">Alternative route</span>
    <button id="navAltSwitchBtn">Switch</button>
  </div>

  <div class="nav-final-approach hidden" id="navFinalApproach"></div>

  <div class="nav-side-controls">
    <button class="nav-compass" id="navCompassBtn" title="Toggle heading-up / north-up">
      <svg id="navCompassSvg" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/>
        <path d="M12 3L14.5 12L12 21L9.5 12L12 3Z" fill="#FF5A1F"/>
        <path d="M12 3L14.5 12L12 12L12 3Z" fill="#fff"/>
        <text x="12" y="6.6" text-anchor="middle" font-size="4.2" fill="#fff" font-family="Manrope,sans-serif" font-weight="800">N</text>
      </svg>
    </button>
    <button class="nav-tilt-btn" id="navTiltBtn">3D</button>
    <button class="nav-mode-icon active" id="navProfileWalk" title="Walking directions">🚶</button>
    <button class="nav-mode-icon" id="navProfileDrive" title="Driving directions">🚗</button>
  </div>

  <div class="nav-gps-pill"><span class="nav-gps-dot" id="navGpsDot"></span><span id="navGpsText">GPS</span></div>
  <div class="nav-banner" id="navBanner"></div>
  <button class="nav-recenter" id="navRecenterBtn">◎</button>
  <div class="nav-bottom">
    <div class="nav-progress-track"><div class="nav-progress-fill" id="navProgressFill"></div></div>
    <div class="nav-stats">
      <div class="nav-stat"><strong id="navRemaining">—</strong><span>Remaining</span></div>
      <div class="nav-stat"><strong id="navEta">—</strong><span>ETA</span></div>
      <div class="nav-stat"><strong id="navSpeed">—</strong><span>Speed</span></div>
      <div class="nav-stat"><strong id="navAccuracy">—</strong><span>GPS</span></div>
    </div>
    <div class="nav-dest-row">
      <div class="nav-dest-dot"></div>
      <div><strong id="navDestName">—</strong><span id="navDestAddr"></span></div>
    </div>
    <div class="nav-actions">
      <button class="nav-action-btn" id="navMuteBtn">🔇 Voice</button>
      <button class="nav-action-btn" id="navShareBtn">📤 Share</button>
      <button class="nav-action-btn" id="navStopBtn">Exit</button>
      <button class="nav-action-btn primary" id="navDetailsBtn">Details</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/nav.js"></script>
<script src="js/business.js"></script>
</body>
</html>
