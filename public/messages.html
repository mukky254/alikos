<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Messages — Aliko</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/shared.css"><link rel="manifest" href="manifest.json"></head>
<body>
<div id="app">
  <div id="site-header"></div>
  <main class="shell wide">
    <div class="chat-shell" id="chatShell">
      <aside class="chat-sidebar" id="chatSidebar">
        <div class="chat-sidebar-head">
          <h2>Chats</h2>
        </div>
        <div class="chat-search"><input id="chatSearchInput" placeholder="Search chats…" autocomplete="off"></div>
        <div id="threadList" class="chat-list"><div class="loading">Loading…</div></div>
      </aside>
      <section class="chat-main" id="chatMain">
        <div class="chat-empty" id="chatEmptyState">
          <div class="chat-empty-icon">💬</div>
          <p>Select a conversation to start messaging.</p>
        </div>
        <div class="chat-active hidden" id="chatActiveView">
          <div class="chat-main-head">
            <button class="chat-back-btn" id="chatBackBtn" aria-label="Back to chats">←</button>
            <div class="chat-avatar" id="conversationAvatar"></div>
            <div>
              <div class="chat-main-name" id="conversationTitle"></div>
              <div class="chat-main-sub" id="conversationSub"></div>
            </div>
          </div>
          <div id="messageBubbles" class="message-bubbles"></div>
          <form id="messageForm" class="message-form">
            <input id="messageInput" placeholder="Type a message…" autocomplete="off" maxlength="2000">
            <button class="btn primary" type="submit">Send</button>
          </form>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/nav.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
