<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot password — Aliko</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="app">
  <div id="site-header"></div>
  <main class="shell narrow">
    <div class="card auth-card">
      <h2 style="margin-bottom:8px;">Forgot your password?</h2>
      <p class="page-sub">Enter your email and we'll generate a reset link.</p>
      <div id="msgBox"></div>
      <form id="forgotForm">
        <div class="field"><label>Email</label><input required type="email" id="email"></div>
        <button class="btn primary block" type="submit">Send reset link</button>
      </form>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('login');
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const res = await api('/auth/forgot-password', { method: 'POST', body: { email: document.getElementById('email').value.trim() } });
    let html = `<div class="note">${escapeHtml(res.message)}</div>`;
    if (res.devResetLink) html += `<p class="note" style="margin-top:8px;">Demo mode: <a href="${res.devResetLink}" style="text-decoration:underline;">click here to reset your password</a>.</p>`;
    document.getElementById('msgBox').innerHTML = html;
  } catch (err) { document.getElementById('msgBox').innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`; }
});
</script>
</body>
</html>
