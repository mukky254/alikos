<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Saved — Aliko</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/shared.css"><link rel="manifest" href="manifest.json"></head>
<body>
<div id="app">
  <div id="site-header"></div>
  <main class="shell">
    <h1 class="page-title">Saved places</h1>
    <p class="page-sub">Businesses you've bookmarked.</p>
    <div class="directory" id="savedResults"><div class="loading">Loading…</div></div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('saved');
requireLogin();
(async () => {
  const wrap = document.getElementById('savedResults');
  try {
    const { businesses } = await api('/saved');
    if (!businesses.length) { wrap.innerHTML = '<div class="empty">Nothing saved yet.</div>'; return; }
    wrap.innerHTML = businesses.map((b) => `
      <a class="row" href="business.html?id=${b.id}">
        <div class="plate">${escapeHtml(b.floor || '·')}<br>${escapeHtml(b.shop || '')}</div>
        <div class="row-main"><div class="row-name">${escapeHtml(b.name)} ${b.verified ? '<span class="badge verified">VERIFIED</span>' : '<span class="badge pending">PENDING</span>'}</div>
        <div class="row-meta">${escapeHtml(b.category)}</div><div class="row-loc">${escapeHtml(b.building)}</div></div>
      </a>`).join('');
  } catch (e) { wrap.innerHTML = `<div class="error-box">${escapeHtml(e.message)}</div>`; }
})();
</script>
</body>
</html>
