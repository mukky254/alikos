<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset password — Aliko</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="app">
  <div id="site-header"></div>
  <main class="shell narrow">
    <div class="card auth-card">
      <h2 style="margin-bottom:16px;">Choose a new password</h2>
      <div id="msgBox"></div>
      <form id="resetForm">
        <div class="field"><label>New password</label><input required type="password" id="newPassword" minlength="6"></div>
        <button class="btn primary block" type="submit">Reset password</button>
      </form>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('login');
const token = new URLSearchParams(window.location.search).get('token');
if (!token) document.getElementById('msgBox').innerHTML = '<div class="error-box">Missing reset token.</div>';
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/auth/reset-password', { method: 'POST', body: { token, newPassword: document.getElementById('newPassword').value } });
    document.getElementById('msgBox').innerHTML = '<div class="note">Password reset. <a href="login.html" style="text-decoration:underline;">Log in</a>.</div>';
    e.target.reset();
  } catch (err) { document.getElementById('msgBox').innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`; }
});
</script>
</body>
</html>
